<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中物理知识点</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,sans-serif}
    html,body{margin:0;padding:0;background:#f7f9fc;height:100%}
    .container{max-width:1000px;margin:0 auto;padding:16px;height:100%;display:flex;flex-direction:column}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    select,button{padding:8px 12px;border-radius:8px;border:1px solid #ddd;font-size:16px}
    .content{
      background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;position:relative
    }
    .content img{
      max-width:100%;max-height:80vh;object-fit:contain;
      border-radius:8px;display:block
    }
    .range-select{margin-bottom:16px;padding:12px;background:#eef6ff;border-radius:10px}
    .tip{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#666;font-size:14px}
  </style>
</head>
<body>
<div class="container">
  <div class="range-select" id="rangeBox">
    <p>首次使用，请选择当前学习章节范围：</p>
    <select id="startChap"></select> ～ <select id="endChap"></select>
    <button onclick="saveRange()">确定</button>
  </div>

  <div class="header">
    <h2>高中物理知识点</h2>
    <select id="chapterSelect" onchange="showChapter()"></select>
  </div>

  <!-- 点击这里切换下一张 -->
  <div class="content" id="contentArea" onclick="nextImage()">
    请选择章节
    <div class="tip" id="tip"></div>
  </div>
</div>

<script>
// ================= 老师编辑的知识点 =================
const chapters = [
{"id":1,"name":"第一章 运动的描述","images":["https://picsum.photos/800/1000?random=1"]},
{"id":2,"name":"第二章 匀变速直线运动","images":["https://picsum.photos/800/1000?random=2"]},
{"id":3,"name":"第三章 相互作用","images":["https://picsum.photos/800/1000?random=3"]},
];

// 当前状态
let allowedChapters = [];
let currentImages = [];    // 当前章节的所有图片
let currentIndex = 0;      // 当前显示第几张

const chapSelect = document.getElementById('chapterSelect');
const startSel = document.getElementById('startChap');
const endSel = document.getElementById('endChap');
const content = document.getElementById('contentArea');
const rangeBox = document.getElementById('rangeBox');
const tip = document.getElementById('tip');

// 初始化章节下拉
function initChapters() {
  startSel.innerHTML = '';
  endSel.innerHTML = '';
  chapSelect.innerHTML = '';
  chapters.forEach(c=>{
    startSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    endSel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

// 保存章节范围
function saveRange() {
  const s = parseInt(startSel.value);
  const e = parseInt(endSel.value);
  allowedChapters = chapters.filter(c=>c.id>=s && c.id<=e);
  localStorage.setItem('allowedChapters', JSON.stringify(allowedChapters));
  rangeBox.style.display = 'none';
  renderAllowed();
  showChapter();
}

// 渲染可选章节
function renderAllowed() {
  chapSelect.innerHTML = '';
  allowedChapters.forEach(c=>{
    chapSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

// 显示当前章节
function showChapter() {
  const id = parseInt(chapSelect.value);
  const chap = allowedChapters.find(x=>x.id===id);
  if(!chap) {
    content.innerHTML = '<div>暂无内容</div>';
    tip.textContent = '';
    currentImages = [];
    currentIndex = 0;
    return;
  }

  currentImages = chap.images;
  currentIndex = 0;
  renderImage();
}

// 渲染当前图片
function renderImage() {
  if(currentImages.length === 0){
    content.innerHTML = '<div>暂无图片</div>';
    tip.textContent = '';
    return;
  }
  content.innerHTML = `<img src="${currentImages[currentIndex]}">`;
  tip.textContent = `第 ${currentIndex+1} / ${currentImages.length} 张 · 点击屏幕下一张`;
}

// 点击下一张（核心功能）
function nextImage() {
  if(currentImages.length <= 1) return;
  currentIndex++;
  if(currentIndex >= currentImages.length) {
    currentIndex = 0; // 循环回到第一张
  }
  renderImage();
}

// 首次加载
window.onload = function(){
  initChapters();
  const saved = localStorage.getItem('allowedChapters');
  if(saved) {
    allowedChapters = JSON.parse(saved);
    rangeBox.style.display = 'none';
    renderAllowed();
    showChapter();
  }
}
</script>
</body>
</html>
